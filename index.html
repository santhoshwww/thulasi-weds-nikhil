<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thulasi ❤️ Nikhil | Wedding Invitation</title>

    <meta name="description"
        content="Together with our families, we invite you to celebrate our wedding.">

    <link rel="icon" href="favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ================= Loading Screen ================= -->

    <div id="loader">

        <div class="loader-content">

            <div class="flower">🌸</div>

            <h1>Thulasi ❤️ Nikhil</h1>

            <p>
                With the blessings of our families,<br>
                we invite you to celebrate our wedding.
            </p>

            <div class="loading-spinner"></div>

        </div>

    </div>

    <!-- ================= Invitation ================= -->

    <main id="invitation">

        <!-- Hero -->

        <section class="page">
            <img src="images/hero.png" alt="Wedding Invitation">
        </section>

        <!-- Ganesha -->

        <section class="page">
            <img src="images/ganesh.png" alt="Lord Ganesha">
        </section>

        <!-- Story -->

        <section class="page">
            <img src="images/story.png" alt="Our Story">
        </section>

        <!-- Functions -->

        <section class="page">
            <img src="images/functions.png" alt="Wedding Functions">
        </section>

        <!-- Scratch Card -->

        <section class="page scratch-section">

            <img src="images/scratch.png" alt="Scratch Card">

            <div class="scratch-container">

                <div id="scratch-result">

                    <h2>✨ SAVE THE DATE ✨</h2>

                    <h3>28 August 2026</h3>

                    <p>Friday</p>

                    <p>Muhurtham</p>

                    <h4>10:18 AM</h4>

                </div>

                <canvas id="scratchCanvas"></canvas>

            </div>

        </section>

        <!-- Venue -->

        <section class="page venue-section">

            <img src="images/venue.png" alt="Venue">

            <a id="mapButton"
               href="#"
               target="_blank"
               class="venue-button">

                View Location

            </a>

        </section>

        <!-- Final -->

        <section class="page final-section">

            <img src="images/final.png" alt="Final">

            <!-- Countdown -->

            <div class="countdown-box">

                <div class="count-item">
                    <span id="days">00</span>
                    <small>Days</small>
                </div>

                <div class="count-item">
                    <span id="hours">00</span>
                    <small>Hours</small>
                </div>

                <div class="count-item">
                    <span id="minutes">00</span>
                    <small>Minutes</small>
                </div>

                <div class="count-item">
                    <span id="seconds">00</span>
                    <small>Seconds</small>
                </div>

            </div>

            <!-- RSVP -->

            <div class="rsvp-buttons">

                <button id="yesBtn">
                    💖 Yes, We'll Be There
                </button>

                <button id="noBtn">
                    ❤️ Sorry, Can't Make It
                </button>

            </div>

        </section>

    </main>

    <!-- RSVP Popup -->

    <div id="popup" class="popup">

        <div class="popup-card">

            <span id="closePopup">&times;</span>

            <h2 id="popupTitle"></h2>

            <p id="popupMessage"></p>

        </div>

    </div>

    <!-- Back to Top -->

    <button id="topButton">

        ↑

    </button>

    <script src="script.js"></script>

</body>

</html>
