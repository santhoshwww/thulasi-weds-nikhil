<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tulasi ❤️ Nikhil | Wedding Invitation</title>

    <meta name="description" content="Together with our families, we invite you to celebrate our wedding.">

    <link rel="icon" href="favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ==========================
         LOADER
    =========================== -->

    <div id="loader">

        <div class="loader-content">

            <div class="flower">♾️</div>

            <h1>Tulasi ❤️ Nikhil</h1>

            <p>
                With the blessings of our families,
                we invite you to celebrate our wedding.
            </p>

            <div class="loading-spinner"></div>

        </div>

    </div>

    <!-- ==========================
         INVITATION
    =========================== -->

    <main id="invitation">

        <!-- HERO -->

        <section class="page">
            <div class="page-wrapper">
                <img src="images/hero.png" alt="Wedding Invitation">
            </div>
        </section>

        <!-- GANESHA -->

        <section class="page">
            <div class="page-wrapper">
                <img src="images/ganesh.png" alt="Lord Ganesha">
            </div>
        </section>

        <!-- STORY -->

        <section class="page">
            <div class="page-wrapper">
                <img src="images/story.png" alt="Our Story">
            </div>
        </section>

        <!-- FUNCTIONS -->

        <section class="page">
            <div class="page-wrapper">
                <img src="images/functions.png" alt="Wedding Functions">
            </div>
        </section>

        <!-- WEDDING DETAILS -->

        <section class="page">
            <div class="page-wrapper">
                <img src="images/scratch.png" alt="Wedding Day">
            </div>
        </section>

        <!-- VENUE -->

        <section class="page">

            <div class="page-wrapper" id="venuePage">

                <img src="images/venue.png" alt="Venue">

                <div class="venue-overlay">

                    <a class="venue-button" href="https://www.google.com/maps/search/?api=1&query=Suguna+Gardens,+Palwancha,+Telangana" target="_blank">
                        View Location
                    </a>

                </div>

            </div>

        </section>

        <!-- FINAL -->

        <section class="page">

            <div class="page-wrapper" id="finalPage">

                <img src="images/final.png" alt="Wedding Invitation">

                <div class="countdown-overlay">

                    <div class="countdown-box">

                        <div class="count-item">
                            <span id="days">00</span>
                            <small>Days</small>
                        </div>

                        <div class="count-item">
                            <span id="hours">00</span>
                            <small>Hours</small>
                        </div>

                        <div class="count-item">
                            <span id="minutes">00</span>
                            <small>Minutes</small>
                        </div>

                        <div class="count-item">
                            <span id="seconds">00</span>
                            <small>Seconds</small>
                        </div>

                    </div>

                </div>

                <div class="rsvp-overlay">

                    <div class="rsvp-buttons">

                        <button id="yesBtn">
                            💖 Yes, We'll Be There
                        </button>

                        <button id="noBtn">
                            ❤️ Sorry, Can't Make It
                        </button>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <!-- ==========================
         RSVP POPUP
    =========================== -->

    <div id="popup" class="popup">

        <div class="popup-card">

            <span id="closePopup">&times;</span>

            <h2 id="popupTitle"></h2>

            <p id="popupMessage"></p>

        </div>

    </div>

    <!-- ==========================
         BACK TO TOP
    =========================== -->

    <button id="topButton">↑</button>

    <script src="script.js"></script>

</body>

</html>
